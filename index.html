<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINECRAFT BTC ORE VAULT</title>

  <!-- iPhoneホーム画面追加時の設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BTC Vault">

  <!-- iPhone用ホーム画面アイコン（黒背景＋オレンジ₿ロゴ） -->
  <link rel="apple-touch-icon" href="">

  <!-- レトロゲーム風フォント -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body {
      background-color: #1a1512;
      background-image: 
        radial-gradient(#2d241e 15%, transparent 16%),
        radial-gradient(#221b16 15%, transparent 16%);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
      color: #ffffff;
      font-family: 'DotGothic16', 'Press Start 2P', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      overflow-x: hidden;
    }

    /* 基本カードUI */
    .mc-card {
      position: relative;
      background-color: #c6c6c6;
      border: 4px solid #000;
      box-shadow: 
        inset -4px -4px 0px 0px #555555,
        inset 4px 4px 0px 0px #ffffff,
        8px 8px 0px 0px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 460px;
      padding: 24px;
      color: #373737;
      text-shadow: 2px 2px 0px #e0e0e0;
      transition: background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
    }

    /* -----------------------------------
       鉱石ランク別 テーマスタイル
    ----------------------------------- */
    .theme-stone {
      border-color: #000;
      background-color: #aaaaaa;
    }
    .theme-stone .rank-badge { color: #555; text-shadow: none; }
    .theme-stone .result-value { color: #ffffff; }

    .theme-iron {
      border-color: #2c3e50;
      background-color: #d8d8d8;
      box-shadow: 0 0 15px rgba(218, 225, 231, 0.4), inset -4px -4px 0px 0px #7f8c8d, inset 4px 4px 0px 0px #ffffff;
    }
    .theme-iron .rank-badge { color: #d37d47; text-shadow: 1px 1px 0 #000; }
    .theme-iron .result-value { color: #e67e22; }

    .theme-copper {
      border-color: #8b4513;
      background-color: #e09f67;
      box-shadow: 0 0 20px rgba(211, 84, 0, 0.5), inset -4px -4px 0px 0px #8b4513, inset 4px 4px 0px 0px #f5cba7;
    }
    .theme-copper .rank-badge { color: #b87333; text-shadow: 1px 1px 0 #000; }
    .theme-copper .result-value { color: #ff7700; }

    .theme-silver {
      border-color: #2c3e50;
      background-color: #e2e8f0;
      box-shadow: 0 0 25px rgba(224, 242, 254, 0.8), inset -4px -4px 0px 0px #94a3b8, inset 4px 4px 0px 0px #ffffff;
    }
    .theme-silver .rank-badge { color: #00aaaa; text-shadow: 1px 1px 0 #000; }
    .theme-silver .result-value { color: #00ffff; }

    .theme-gold {
      border-color: #b8860b;
      background-color: #ffe066;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.9), inset -4px -4px 0px 0px #b8860b, inset 4px 4px 0px 0px #fff9c4;
      animation: gold-pulse 1.5s infinite alternate;
    }
    .theme-gold .rank-badge { color: #ffaa00; text-shadow: 2px 2px 0 #000; }
    .theme-gold .result-value { color: #ffcc00; text-shadow: 2px 2px 0 #000; }

    .theme-diamond {
      border-color: #00ffff;
      background-color: #b3f5fc;
      box-shadow: 0 0 45px rgba(0, 255, 255, 1), 0 0 80px rgba(255, 0, 255, 0.4), inset -4px -4px 0px 0px #008b8b, inset 4px 4px 0px 0px #e0ffff;
      animation: diamond-pulse 1s infinite alternate;
    }
    .theme-diamond .rank-badge { color: #00ffff; text-shadow: 2px 2px 0 #000; }
    .theme-diamond .result-value { color: #55ffff; text-shadow: 3px 3px 0 #000; }

    /* 🚨 1/399 バグ発生時のグリッチ演出テーマ 🚨 */
    .theme-bug {
      border-color: #ff0055 !important;
      background-color: #2a000f !important;
      box-shadow: 0 0 50px #ff0055, inset 0 0 20px #ff0000 !important;
      animation: bug-glitch 0.2s infinite alternate !important;
    }
    .theme-bug .rank-badge {
      color: #ff0055 !important;
      background: #000000 !important;
      border-color: #ff0055 !important;
      text-shadow: 0 0 8px #ff0055 !important;
      animation: blink 0.3s infinite alternate;
    }
    .theme-bug .result-value {
      color: #00ffff !important;
      text-shadow: 3px 3px 0px #ff0055, -3px -3px 0px #0000ff !important;
      animation: text-shake 0.15s infinite;
    }

    @keyframes bug-glitch {
      0% { transform: translate(2px, 1px) rotate(0.5deg); filter: hue-rotate(0deg); }
      50% { transform: translate(-2px, -2px) rotate(-0.5deg); filter: hue-rotate(90deg); }
      100% { transform: translate(1px, -1px) rotate(0deg); filter: hue-rotate(180deg); }
    }
    @keyframes text-shake {
      0% { transform: translate(1px, 0); }
      50% { transform: translate(-1px, -1px); }
      100% { transform: translate(0, 1px); }
    }
    @keyframes blink {
      0% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    @keyframes gold-pulse {
      0% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.7); }
      100% { box-shadow: 0 0 45px rgba(255, 215, 0, 1); }
    }
    @keyframes diamond-pulse {
      0% { box-shadow: 0 0 35px rgba(0, 255, 255, 0.8); }
      100% { box-shadow: 0 0 60px rgba(0, 255, 255, 1), 0 0 90px rgba(255, 0, 255, 0.6); }
    }

    /* キラキラパーティクル */
    .sparkle-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }
    .pixel-sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      opacity: 0;
      animation: sparkle-anim var(--duration) infinite ease-in-out var(--delay);
    }
    @keyframes sparkle-anim {
      0% { transform: translateY(0) scale(0) rotate(0deg); opacity: 0; }
      50% { transform: translateY(-20px) scale(1.5) rotate(45deg); opacity: 1; }
      100% { transform: translateY(-40px) scale(0) rotate(90deg); opacity: 0; }
    }

    .mc-header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 4px solid rgba(0,0,0,0.3);
    }

    .mc-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 15px;
      color: #373737;
      text-shadow: 2px 2px 0px #ffffff;
      margin: 0 0 8px 0;
    }

    .rank-badge {
      font-family: 'DotGothic16', monospace;
      font-size: 14px;
      font-weight: bold;
      background: rgba(0,0,0,0.7);
      padding: 6px 12px;
      display: inline-block;
      border: 2px solid #000;
      margin-top: 4px;
    }

    .mc-screen {
      background-color: #000000;
      border: 4px solid #373737;
      box-shadow: inset 4px 4px 0px #1e1e1e;
      padding: 14px;
      margin-bottom: 20px;
      color: #55ff55;
      font-size: 13px;
      text-shadow: none;
    }

    .price-label { color: #aaa; font-size: 11px; margin-bottom: 4px; }
    .price-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 15px;
      color: #55ffff;
      word-break: break-all;
    }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #000;
      text-shadow: none;
      font-size: 14px;
    }

    input[type="number"] {
      width: 100%;
      background-color: #8b8b8b;
      color: #ffffff;
      font-family: 'Press Start 2P', 'DotGothic16', monospace;
      font-size: 15px;
      padding: 12px;
      border: 4px solid #000;
      box-shadow: inset 4px 4px 0px 0px #373737, inset -4px -4px 0px 0px #ffffff;
      outline: none;
    }

    .result-box {
      background-color: #1e1e1e;
      border: 4px solid #000;
      box-shadow: inset 4px 4px 0px #000;
      padding: 18px 12px;
      text-align: center;
      color: #fff;
      text-shadow: none;
    }

    .result-label { font-size: 12px; color: #aaaaaa; margin-bottom: 8px; }

    .result-value {
      font-family: 'Press Start 2P', monospace;
      font-size: 20px;
      letter-spacing: 2px;
      min-height: 28px;
    }

    .unit { font-size: 13px; color: #fff; margin-left: 4px; }
  </style>
</head>
<body>

  <div class="mc-card theme-stone" id="mc-card">
    <div class="sparkle-container" id="sparkle-container"></div>

    <div class="mc-header">
      <h1 class="mc-title">⛏ BTC ORE VAULT ⛏</h1>
      <div class="rank-badge" id="rank-badge">🪨 石ランク</div>
    </div>

    <div class="mc-screen">
      <div class="price-label" id="price-label">▶ CURRENT 1 BTC RATE:</div>
      <div class="price-value"><span id="current-price">LOADING...</span> <span style="font-size: 10px;">JPY</span></div>
    </div>

    <div class="field">
      <label for="btc-amount">⛏ 保有BTC数量:</label>
      <input type="number" id="btc-amount" step="any" placeholder="0.00">
    </div>

    <div class="result-box">
      <div class="result-label" id="result-label">TOTAL VALUE (評価額)</div>
      <div class="result-value">
        <span id="total-jpy">0</span><span class="unit">円</span>
      </div>
    </div>
  </div>

  <script>
    let btcPriceJPY = 0;
    let animInterval = null;

    // 黒背景＋オレンジ₿ロゴアイコンの生成
    function setupBitcoinIcon() {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 180;
        canvas.height = 180;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#111111';
        ctx.fillRect(0, 0, 180, 180);

        ctx.beginPath();
        ctx.arc(90, 90, 68, 0, Math.PI * 2);
        ctx.fillStyle = '#F7931A';
        ctx.fill();

        ctx.save();
        ctx.translate(90, 90);
        ctx.rotate((14 * Math.PI) / 180);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 96px "Arial", "Helvetica", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('₿', 0, 2);
        ctx.restore();

        const iconLink = document.querySelector("link[rel='apple-touch-icon']");
        if (iconLink) {
          iconLink.href = canvas.toDataURL('image/png');
        }
      } catch (e) {
        console.error('Icon generation failed:', e);
      }
    }

    // BTC価格の取得
    async function fetchBtcPrice() {
      try {
        const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=jpy');
        const data = await response.json();
        btcPriceJPY = data.bitcoin.jpy;
        
        document.getElementById('current-price').innerText = btcPriceJPY.toLocaleString();
        
        const val = document.getElementById('btc-amount').value;
        if (val !== '' && !isNaN(val)) {
          startCalculation();
        }
      } catch (error) {
        document.getElementById('current-price').innerText = 'ERROR!';
        console.error('価格取得エラー:', error);
      }
    }

    // 計算およびスロット演出の開始
    function startCalculation() {
      const val = document.getElementById('btc-amount').value;
      
      if (val === '' || isNaN(val)) {
        if (animInterval) clearInterval(animInterval);
        resetThemeToMining();
        document.getElementById('total-jpy').innerText = '0';
        document.getElementById('rank-badge').innerText = '🪨 石ランク';
        return;
      }

      const amount = parseFloat(val) || 0;

      // ★ 1/399の確率でバグ判定（整数2〜10倍）
      let bugMultiplier = 1;
      const bugChance = Math.floor(Math.random() * 399); // 0〜398の乱数
      if (bugChance === 0) {
        // バグ当選！2倍〜10倍の整数ランダム
        bugMultiplier = Math.floor(Math.random() * 9) + 2;
      }

      const effectivePrice = btcPriceJPY * bugMultiplier;
      const total = Math.floor(amount * effectivePrice);

      resetThemeToMining();
      animateDigitsFromRight(total, bugMultiplier);
    }

    function resetThemeToMining() {
      const card = document.getElementById('mc-card');
      const badge = document.getElementById('rank-badge');
      const container = document.getElementById('sparkle-container');
      const resultLabel = document.getElementById('result-label');
      
      card.className = 'mc-card theme-stone';
      badge.innerText = '⛏ 鑑定中...';
      container.innerHTML = '';
      resultLabel.innerText = 'TOTAL VALUE (評価額)';
      resultLabel.style.color = '#aaaaaa';
    }

    // 鉱石テーマ（または1/399バグテーマ）の適用
    function applyFinalOreTheme(total, bugMultiplier) {
      const card = document.getElementById('mc-card');
      const badge = document.getElementById('rank-badge');
      const resultLabel = document.getElementById('result-label');
      
      card.className = 'mc-card';

      // 🚨 バグ発生時の処理
      if (bugMultiplier > 1) {
        card.classList.add('theme-bug');
        badge.innerText = `⚠️ SYSTEM BUG: ${bugMultiplier}x MULTIPLIER ⚠️`;
        resultLabel.innerText = `⚠️ CRITICAL BUG DETECTED (${bugMultiplier}倍暴騰) ⚠️`;
        resultLabel.style.color = '#ff0055';

        // 派手なネオンバグパーティクル
        generateSparkles(50, ['#ff0055', '#00ffff', '#ffff00', '#ffffff', '#ff00ff']);
        return;
      }
      
      let themeClass = 'theme-stone';
      let rankText = '🪨 石ランク (2,000万未満)';
      let sparkleCount = 0;
      let sparkleColors = [];

      if (total >= 200000000) {
        themeClass = 'theme-diamond';
        rankText = '💎 ダイアランク (2億円超) ✨最上級✨';
        sparkleCount = 40;
        sparkleColors = ['#00ffff', '#ffffff', '#ff77ff', '#55ffff'];
      } else if (total >= 100000000) {
        themeClass = 'theme-gold';
        rankText = '👑 金ランク (1億円超) ✨超絶輝き✨';
        sparkleCount = 28;
        sparkleColors = ['#ffd700', '#ffaa00', '#ffffff', '#fff9c4'];
      } else if (total >= 50000000) {
        themeClass = 'theme-silver';
        rankText = '⚔️ 銀ランク (5,000万超) ✨キラキラ✨';
        sparkleCount = 18;
        sparkleColors = ['#ffffff', '#a6d8ff', '#e0e0e0'];
      } else if (total >= 30000000) {
        themeClass = 'theme-copper';
        rankText = '🥉 銅ランク (3,000万超) ✨キラキラ✨';
        sparkleCount = 10;
        sparkleColors = ['#ff9d42', '#e67e22', '#ffffff'];
      } else if (total >= 20000000) {
        themeClass = 'theme-iron';
        rankText = '⚙️ 鉄ランク (2,000万超)';
        sparkleCount = 0;
      } else {
        themeClass = 'theme-stone';
        rankText = '🪨 石ランク (2,000万未満)';
        sparkleCount = 0;
      }

      card.classList.add(themeClass);
      badge.innerText = rankText;
      generateSparkles(sparkleCount, sparkleColors);
    }

    function generateSparkles(count, colors) {
      const container = document.getElementById('sparkle-container');
      container.innerHTML = '';
      if (count === 0) return;

      for (let i = 0; i < count; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'pixel-sparkle';
        sparkle.style.left = Math.random() * 100 + '%';
        sparkle.style.top = Math.random() * 100 + '%';
        sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        sparkle.style.setProperty('--delay', (Math.random() * 2) + 's');
        sparkle.style.setProperty('--duration', (1 + Math.random() * 1.5) + 's');
        container.appendChild(sparkle);
      }
    }

    // 右（一の位）からのスロット演出
    function animateDigitsFromRight(finalTotal, bugMultiplier) {
      if (animInterval) clearInterval(animInterval);

      const targetStr = finalTotal.toLocaleString();
      const len = targetStr.length;
      const displayEl = document.getElementById('total-jpy');

      let lockedFromRight = 0;
      const lockIntervalMs = 350;
      const startTime = Date.now();

      animInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        lockedFromRight = Math.floor(elapsed / lockIntervalMs);

        if (lockedFromRight >= len) {
          lockedFromRight = len;
          clearInterval(animInterval);
          animInterval = null;
          applyFinalOreTheme(finalTotal, bugMultiplier);
        }

        let currentDisplay = '';
        for (let i = 0; i < len; i++) {
          const charFromRight = len - 1 - i;
          const targetChar = targetStr[i];

          if (targetChar === ',') {
            currentDisplay += ',';
          } else if (charFromRight < lockedFromRight) {
            currentDisplay += targetChar;
          } else {
            currentDisplay += Math.floor(Math.random() * 10);
          }
        }

        displayEl.innerText = currentDisplay;
      }, 40);
    }

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      setupBitcoinIcon();
      document.getElementById('btc-amount').addEventListener('input', startCalculation);
      fetchBtcPrice();
      setInterval(fetchBtcPrice, 60000);
    });
  </script>

</body>
</html>
